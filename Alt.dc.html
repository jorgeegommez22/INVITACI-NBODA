<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap">
  <style>
    body { margin: 0; background: #ECE8DA; font-family: 'Jost', 'Century Gothic', 'Trebuchet MS', sans-serif; }
    a { color: #B4924F; text-decoration: none; }
    a:hover { color: #937534; }

    .card {
      position: relative;
      width: 600px;
      height: 840px;
      box-sizing: border-box;
      background: #F8F5EC;
      overflow: hidden;
    }

    .spray {
      position: absolute;
      opacity: 0.9;
      line-height: 0;
    }
    .spray-tl { top: 30px; left: 30px; }
    .spray-br { bottom: 30px; right: 30px; transform: rotate(180deg); }

    .content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 60px;
      box-sizing: border-box;
      text-align: center;
    }

    .flourish { margin-bottom: 28px; line-height: 0; }

    .names {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 14px;
      white-space: nowrap;
    }
    .name {
      font-family: 'Pinyon Script', 'Snell Roundhand', 'Apple Chancery', cursive;
      font-size: 60px;
      line-height: 1.1;
      color: #43423B;
      font-weight: 400;
    }
    .amp {
      font-family: 'Cormorant Garamond', Garamond, 'Times New Roman', serif;
      font-style: italic;
      font-size: 26px;
      color: #B4924F;
    }

    .date-wrap { margin-top: 26px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .date-rule { width: 52px; height: 1px; background: #C6A968; }
    .date {
      font-family: 'Cormorant Garamond', Garamond, 'Times New Roman', serif;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #43423B;
    }

    .details {
      margin-top: 58px;
      width: 300px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .detail { display: flex; flex-direction: column; gap: 10px; }
    .detail-label {
      font-family: 'Jost', 'Century Gothic', sans-serif;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #6C6E4F;
    }
    .detail-line { width: 100%; height: 1.2px; background: #C7C8B2; }
  </style>
</helmet>

<div class="card">
  <div class="spray spray-tl">
    <svg width="160" height="120" viewBox="0 0 160 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <g stroke="#818468" stroke-width="1.2" stroke-linecap="round">
        <path d="M6 6 C 40 18 70 40 96 92"></path>
        <path d="M34 20 C 30 30 30 40 36 50"></path>
        <path d="M52 34 C 46 44 46 56 54 66"></path>
        <path d="M70 52 C 64 62 64 74 74 86"></path>
        <path d="M40 16 C 50 12 60 12 70 18"></path>
        <path d="M58 30 C 68 26 78 26 88 32"></path>
      </g>
      <g fill="#8B8D6A">
        <ellipse cx="34" cy="50" rx="9" ry="3.3" transform="rotate(70 34 50)"></ellipse>
        <ellipse cx="53" cy="66" rx="9" ry="3.3" transform="rotate(70 53 66)"></ellipse>
        <ellipse cx="74" cy="87" rx="9" ry="3.3" transform="rotate(66 74 87)"></ellipse>
        <ellipse cx="71" cy="17" rx="8.5" ry="3.2" transform="rotate(24 71 17)"></ellipse>
        <ellipse cx="89" cy="31" rx="8.5" ry="3.2" transform="rotate(24 89 31)"></ellipse>
      </g>
      <circle cx="20" cy="12" r="2.2" fill="#B4924F"></circle>
      <circle cx="62" cy="42" r="1.8" fill="#B4924F"></circle>
    </svg>
  </div>

  <div class="spray spray-br">
    <svg width="160" height="120" viewBox="0 0 160 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <g stroke="#818468" stroke-width="1.2" stroke-linecap="round">
        <path d="M6 6 C 40 18 70 40 96 92"></path>
        <path d="M34 20 C 30 30 30 40 36 50"></path>
        <path d="M52 34 C 46 44 46 56 54 66"></path>
        <path d="M70 52 C 64 62 64 74 74 86"></path>
        <path d="M40 16 C 50 12 60 12 70 18"></path>
        <path d="M58 30 C 68 26 78 26 88 32"></path>
      </g>
      <g fill="#8B8D6A">
        <ellipse cx="34" cy="50" rx="9" ry="3.3" transform="rotate(70 34 50)"></ellipse>
        <ellipse cx="53" cy="66" rx="9" ry="3.3" transform="rotate(70 53 66)"></ellipse>
        <ellipse cx="74" cy="87" rx="9" ry="3.3" transform="rotate(66 74 87)"></ellipse>
        <ellipse cx="71" cy="17" rx="8.5" ry="3.2" transform="rotate(24 71 17)"></ellipse>
        <ellipse cx="89" cy="31" rx="8.5" ry="3.2" transform="rotate(24 89 31)"></ellipse>
      </g>
      <circle cx="20" cy="12" r="2.2" fill="#B4924F"></circle>
      <circle cx="62" cy="42" r="1.8" fill="#B4924F"></circle>
    </svg>
  </div>

  <div class="content">
    <div class="flourish">
      <svg width="46" height="8" viewBox="0 0 46 8" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="7" cy="4" r="2" fill="#B4924F"></circle>
        <circle cx="23" cy="4" r="2.4" fill="#B4924F"></circle>
        <circle cx="39" cy="4" r="2" fill="#B4924F"></circle>
      </svg>
    </div>

    <div class="names">
      <span class="name">Mónica</span>
      <span class="amp">&amp;</span>
      <span class="name">Ignacio</span>
    </div>

    <div class="date-wrap">
      <span class="date-rule"></span>
      <span class="date">10 de julio de 2027</span>
    </div>

    <div class="details">
      <div class="detail">
        <div class="detail-label">Lugar de la ceremonia</div>
        <div class="detail-line"></div>
      </div>
      <div class="detail">
        <div class="detail-label">Lugar de la celebración</div>
        <div class="detail-line"></div>
      </div>
      <div class="detail">
        <div class="detail-label">Hora</div>
        <div class="detail-line"></div>
      </div>
      <div class="detail">
        <div class="detail-label">Confirmación de asistencia</div>
        <div class="detail-line"></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
