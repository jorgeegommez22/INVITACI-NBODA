<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap">
  <style>
    body { margin: 0; background: #ECE8DA; font-family: 'Jost', 'Century Gothic', 'Trebuchet MS', sans-serif; }
    a { color: #B4924F; text-decoration: none; }
    a:hover { color: #937534; }

    .card {
      position: relative;
      width: 600px;
      height: 840px;
      box-sizing: border-box;
      background: #F8F5EC;
      overflow: hidden;
    }

    .frame {
      position: absolute;
      inset: 22px;
      border: 1.3px solid #D8C6A0;
      pointer-events: none;
    }

    .sprig {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0.92;
    }
    .sprig-top {
      top: 56px;
      transform: translateX(-50%) rotate(180deg);
    }
    .sprig-bottom { bottom: 60px; }

    .content {
      position: absolute;
      inset: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 48px;
      box-sizing: border-box;
      text-align: center;
    }

    .names { display: flex; flex-direction: column; align-items: center; }
    .name {
      font-family: 'Pinyon Script', 'Snell Roundhand', 'Apple Chancery', cursive;
      font-size: 74px;
      line-height: 1.12;
      color: #43423B;
      font-weight: 400;
    }
    .amp {
      font-family: 'Cormorant Garamond', Garamond, 'Times New Roman', serif;
      font-style: italic;
      font-size: 30px;
      color: #B4924F;
      margin: 4px 0;
      line-height: 1;
    }

    .flourish { margin: 22px 0 20px; line-height: 0; }

    .date-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 52px;
    }
    .date-rule { width: 30px; height: 1px; background: #C6A968; }
    .date {
      font-family: 'Cormorant Garamond', Garamond, 'Times New Roman', serif;
      font-size: 28px;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: #43423B;
      white-space: nowrap;
    }

    .details {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      width: 100%;
    }
    .detail { display: flex; flex-direction: column; align-items: center; gap: 11px; }
    .detail-label {
      font-family: 'Jost', 'Century Gothic', sans-serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: #6C6E4F;
    }
    .detail-line { width: 232px; height: 1.2px; background: #C7C8B2; }
  </style>
</helmet>

<div class="card">
  <div class="frame"></div>

  <div class="sprig sprig-top">
    <svg width="150" height="72" viewBox="0 0 150 72" fill="none" xmlns="http://www.w3.org/2000/svg">
      <g stroke="#818468" stroke-width="1.3" stroke-linecap="round">
        <path d="M75 70 C 75 54 75 40 75 24"></path>
        <path d="M75 58 C 64 56 55 49 50 39"></path>
        <path d="M75 48 C 62 46 52 38 47 27"></path>
        <path d="M75 38 C 64 36 56 28 54 18"></path>
        <path d="M75 58 C 86 56 95 49 100 39"></path>
        <path d="M75 48 C 88 46 98 38 103 27"></path>
        <path d="M75 38 C 86 36 94 28 96 18"></path>
      </g>
      <g fill="#8B8D6A">
        <ellipse cx="47" cy="37" rx="9" ry="3.4" transform="rotate(40 47 37)"></ellipse>
        <ellipse cx="44" cy="24" rx="9.5" ry="3.5" transform="rotate(56 44 24)"></ellipse>
        <ellipse cx="52" cy="15" rx="8" ry="3.1" transform="rotate(66 52 15)"></ellipse>
        <ellipse cx="103" cy="37" rx="9" ry="3.4" transform="rotate(-40 103 37)"></ellipse>
        <ellipse cx="106" cy="24" rx="9.5" ry="3.5" transform="rotate(-56 106 24)"></ellipse>
        <ellipse cx="98" cy="15" rx="8" ry="3.1" transform="rotate(-66 98 15)"></ellipse>
      </g>
      <circle cx="75" cy="20" r="2.6" fill="#B4924F"></circle>
      <circle cx="60" cy="44" r="1.9" fill="#B4924F"></circle>
      <circle cx="90" cy="44" r="1.9" fill="#B4924F"></circle>
    </svg>
  </div>

  <div class="content">
    <div class="names">
      <div class="name">Mónica</div>
      <div class="amp">&amp;</div>
      <div class="name">Ignacio</div>
    </div>

    <div class="flourish">
      <svg width="46" height="8" viewBox="0 0 46 8" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="7" cy="4" r="2" fill="#B4924F"></circle>
        <circle cx="23" cy="4" r="2.4" fill="#B4924F"></circle>
        <circle cx="39" cy="4" r="2" fill="#B4924F"></circle>
      </svg>
    </div>

    <div class="date-row">
      <span class="date-rule"></span>
      <span class="date">10 de julio de 2027</span>
      <span class="date-rule"></span>
    </div>

    <div class="details">
      <div class="detail">
        <div class="detail-label">Lugar de la ceremonia</div>
        <div class="detail-line"></div>
      </div>
      <div class="detail">
        <div class="detail-label">Lugar de la celebración</div>
        <div class="detail-line"></div>
      </div>
      <div class="detail">
        <div class="detail-label">Hora</div>
        <div class="detail-line"></div>
      </div>
      <div class="detail">
        <div class="detail-label">Confirmación de asistencia</div>
        <div class="detail-line"></div>
      </div>
    </div>
  </div>

  <div class="sprig sprig-bottom">
    <svg width="96" height="42" viewBox="0 0 96 42" fill="none" xmlns="http://www.w3.org/2000/svg">
      <g stroke="#818468" stroke-width="1.2" stroke-linecap="round">
        <path d="M48 40 C 48 30 48 22 48 12"></path>
        <path d="M48 30 C 40 28 34 22 31 14"></path>
        <path d="M48 22 C 40 20 34 14 32 6"></path>
        <path d="M48 30 C 56 28 62 22 65 14"></path>
        <path d="M48 22 C 56 20 62 14 64 6"></path>
      </g>
      <g fill="#8B8D6A">
        <ellipse cx="30" cy="12" rx="7.5" ry="3" transform="rotate(50 30 12)"></ellipse>
        <ellipse cx="33" cy="4" rx="6.5" ry="2.7" transform="rotate(64 33 4)"></ellipse>
        <ellipse cx="66" cy="12" rx="7.5" ry="3" transform="rotate(-50 66 12)"></ellipse>
        <ellipse cx="63" cy="4" rx="6.5" ry="2.7" transform="rotate(-64 63 4)"></ellipse>
      </g>
      <circle cx="48" cy="9" r="2.2" fill="#B4924F"></circle>
    </svg>
  </div>
</div>
</x-dc>
</body>
</html>
